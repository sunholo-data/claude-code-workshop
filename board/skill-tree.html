<title>Claude Code Skill Tree</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one lane per tier, left to right as the path runs; a detail drawer for the chosen node. */
:root{
  --bg:#f5f6f8;--panel:#ffffff;--ink:#1c2230;--muted:#5d6678;--line:#dde1e8;
  --accent:#c2410c;--accent-soft:#fdeee6;
  --done:#15803d;--done-soft:#e3f4e8;--part:#a16207;--part-soft:#fbf1d9;--lock:#9aa3b2;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151c;--panel:#1a1f29;--ink:#e6e9ef;--muted:#9aa3b5;--line:#2c3340;
  --accent:#fb7c46;--accent-soft:#3a2219;
  --done:#4ade80;--done-soft:#173322;--part:#facc15;--part-soft:#352d12;--lock:#5b6475;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c;--panel:#1a1f29;--ink:#e6e9ef;--muted:#9aa3b5;--line:#2c3340;
  --accent:#fb7c46;--accent-soft:#3a2219;
  --done:#4ade80;--done-soft:#173322;--part:#facc15;--part-soft:#352d12;--lock:#5b6475;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1360px;margin:0 auto;padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,40px);letter-spacing:-.02em;line-height:1.05;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible,.node:focus-visible,.btn:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font:500 12px var(--mono);color:var(--muted);letter-spacing:.02em}
.status b{color:var(--ink);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;border:1.5px solid var(--lock)}
.dot.done{background:var(--done);border-color:var(--done)}.dot.part{background:var(--part);border-color:var(--part)}
.dot.open{border-color:var(--accent)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.lane{display:flex;flex-direction:column;gap:8px;min-width:0}
.lane h2{margin:0 0 2px;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.lane h2 strong{font-family:var(--display);font-size:17px;letter-spacing:-.01em;text-transform:none;color:var(--ink)}
.node{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:8px;
  background:var(--panel);border:1.5px solid var(--line);cursor:pointer;min-width:0}
.node .t{font-weight:600;font-size:14px;line-height:1.25}
.node .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 11px var(--mono);color:var(--muted)}
.pill{padding:1px 7px;border-radius:999px;font:500 11px var(--mono)}
.node.locked{opacity:.6;border-style:dashed}
.node.open{border-color:var(--accent)}
.node.open .pill{background:var(--accent-soft);color:var(--accent)}
.node.done{border-color:var(--done);background:var(--done-soft)}
.node.done .pill{background:var(--done);color:var(--panel)}
.node.part{border-color:var(--part);background:var(--part-soft)}
.node.part .pill{background:var(--part);color:var(--panel)}
.node.goal .t::after{content:" · end goal";font:500 11px var(--mono);color:var(--accent)}
.node[aria-current="true"]{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 4.5px var(--accent)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .d{background:var(--done)}.bar .p{background:var(--part)}
.room .node{cursor:pointer}
.drawer{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.drawer h3{margin:0;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
.k{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 3px}
.drawer p{margin:0}
.can{font-size:16px}
textarea{width:100%;box-sizing:border-box;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--ink);font:14px/1.4 var(--body)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:600 13px var(--body);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--done);border-color:var(--done);color:var(--panel)}
.btn.part{border-color:var(--part);color:var(--part)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:13px;color:var(--muted)}
.because{font-size:14px;padding:10px;border-radius:8px;background:var(--done-soft);border:1px solid var(--done)}
.empty{color:var(--muted);font-size:14px}
@media (max-width:1100px){.lanes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}.drawer{position:static}}
@media (max-width:480px){.lanes{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.node{transition:border-color .2s,background .2s}}
</style>
<div class="wrap">
  <header>
    <div>
      <h1>Claude Code Skill Tree</h1>
      <p class="sub">Your path through the workshop. A node unlocks when everything it needs is done. Mark a node done when you can show its proof, and say how.</p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="View">
        <button id="v-me" aria-pressed="true">My progress</button>
        <button id="v-room" aria-pressed="false">The room</button>
      </div>
    </div>
  </header>
  <div class="legend" id="legend"></div>
  <p class="status" id="status">Connecting…</p>
  <div class="main">
    <div class="lanes" id="lanes"></div>
    <aside class="drawer" id="drawer" aria-live="polite"></aside>
  </div>
</div>
<script>
const NODES = [{"id":"install","tier":"0","title":"Claude Desktop, Code tab","needs":[],"can":"I can open a folder in the Code tab and get Claude to create a file in it.","proof":"hello.txt exists in a test folder."},{"id":"git-installed","tier":"0","title":"Git and a GitHub account","needs":[],"can":"I have git installed and a GitHub account I can sign in to.","proof":"`git --version` prints a version; GitHub username sent to the facilitator."},{"id":"chat-vs-agent","tier":"1","title":"Chat versus agent","needs":["install"],"can":"I can explain what changes when the AI reads and writes files and runs commands, instead of me pasting text in and out.","proof":"Claude edited a file you then opened and checked yourself."},{"id":"folders-context","tier":"1","title":"The folder is the context","needs":["chat-vs-agent"],"can":"I can point Claude at the files it needs with @, and say what it can and cannot see.","proof":"A question answered from two files you @-mentioned."},{"id":"permissions-review","tier":"1","title":"Permissions and reviewing changes","needs":["chat-vs-agent"],"can":"I can pick a permission mode, read a diff, and reject a change I don't want.","proof":"One change rejected and re-asked; the reason said aloud."},{"id":"plan-first","tier":"1","title":"Plan before acting","needs":["permissions-review"],"can":"I can use Plan mode to agree an approach before anything is changed.","proof":"A plan you edited before approving it."},{"id":"models","tier":"1","title":"Choosing a model","needs":["chat-vs-agent"],"can":"I can choose a model for a task, and say what I trade between quality, speed and plan usage.","proof":"Same small task on two models; one sentence on the difference."},{"id":"context-hygiene","tier":"1","title":"Sessions and context","needs":["folders-context"],"can":"I know when to start a fresh session, and why long sessions get worse.","proof":"A task restarted in a new session with a one-paragraph brief."},{"id":"claude-md","tier":"2","title":"CLAUDE.md — standing instructions","needs":["plan-first","folders-context"],"can":"I can write a CLAUDE.md and watch it change what Claude does.","proof":"Before/after: the same request, different behaviour, because of one rule."},{"id":"team-conventions","tier":"2","title":"Team conventions and data handling","needs":["claude-md"],"can":"I can say what may and may not be given to a model, and where that rule is written down.","proof":"Your line in the team's conventions file."},{"id":"git-safety-net","tier":"3","title":"Git as undo","needs":["permissions-review","git-installed"],"can":"I can ask Claude to commit my work, see what changed, and go back.","proof":"Three commits in a log; one change undone."},{"id":"clone-branch","tier":"3","title":"Clone, branch, push","needs":["git-safety-net"],"can":"I can clone a repository, work on a branch, and push it.","proof":"Your branch visible on GitHub."},{"id":"use-a-skill","tier":"4","title":"Use someone else's skill","needs":["clone-branch","claude-md"],"can":"I can clone a repo that carries a skill and get the result its author intended, without knowing how.","proof":"A three-slide deck built with presentation-template's presentation-slides skill, passing its lint."},{"id":"skill-anatomy","tier":"4","title":"How a skill is built","needs":["use-a-skill"],"can":"I can read a SKILL.md and say when it triggers, what it tells Claude, and what it carries with it.","proof":"The skill's description rewritten so it triggers on a phrase you'd actually use."},{"id":"write-a-skill","tier":"4","title":"Write your own skill","needs":["skill-anatomy"],"can":"I can turn something I do repeatedly into a skill that someone else could run.","proof":"A colleague runs your skill and gets the right result without asking you."},{"id":"connectors","tier":"5","title":"Connectors and MCP","needs":["team-conventions"],"can":"I can explain the difference between pasting an export and connecting the source, and what each sends to the model.","proof":"A question answered from a connected source, with the data path said aloud."},{"id":"add-mcp","tier":"5","title":"Add a remote MCP server","needs":["connectors"],"can":"I can add a hosted MCP server to a project with an API key, and use its tools.","proof":"An answer that came from the MCP tool (Google Developer Knowledge), not from Claude's memory."},{"id":"own-api-key","tier":"5","title":"Make your own API key","needs":["add-mcp"],"can":"I can create a restricted API key in my own Google Cloud project and swap it in for the one I was lent.","proof":"The server still works after the lent key is revoked."},{"id":"local-mcp","tier":"5","title":"A local MCP server on your own data","needs":["add-mcp","team-conventions"],"can":"I can run an MCP server on my laptop that reads my own data as me, and say what it can reach.","proof":"A Google Analytics report from a property your group's rules allow, with the property named."},{"id":"shared-skills-repo","tier":"6","title":"The team's skills repository","needs":["write-a-skill","clone-branch"],"can":"I can install the team's shared skills and keep them up to date.","proof":"The shared skills show up in your Code tab session; you pulled a change someone else made."},{"id":"share-skill-pr","tier":"6","title":"Contribute a skill by pull request","needs":["shared-skills-repo"],"can":"I can propose a skill to the team by pull request, review someone else's, and see it reach everyone.","proof":"Your skill merged; a colleague in the other group used it."},{"id":"real-task","tier":"6","title":"One real task, end to end","needs":["claude-md","git-safety-net"],"can":"I can take a real piece of my own work from request to checked result in the new mode.","proof":"Shown to the room: what you asked, what it did, how you checked it."},{"id":"verify-output","tier":"B","title":"Checking the work","needs":["real-task"],"can":"I can get Claude to show its evidence and check its own output against something I trust.","proof":"A check that caught something."},{"id":"data-files","tier":"B","title":"Spreadsheets and data files","needs":["folders-context"],"can":"I can have Claude analyse a CSV or spreadsheet with a script, and rerun it.","proof":"A script in the folder that reproduces the numbers."},{"id":"settings-permissions","tier":"B","title":"Settings and allowed commands","needs":["permissions-review"],"can":"I can allow or deny specific actions in settings instead of approving them every time.","proof":"A settings file with one allow and one deny rule."},{"id":"hooks","tier":"B","title":"Hooks","needs":["settings-permissions"],"can":"I can make something happen automatically before or after Claude acts.","proof":"A hook that ran."},{"id":"subagents","tier":"B","title":"Subagents and parallel sessions","needs":["context-hygiene"],"can":"I can hand a side-task to a subagent or a second session and bring back only the result.","proof":"A research result returned to the main session."},{"id":"scheduled","tier":"B","title":"Running without you","needs":["write-a-skill","local-mcp"],"can":"I can describe what it takes for a task to run on a schedule, and what has to be true before it should.","proof":"A scheduled run's output."},{"id":"skill-routing","tier":"B","title":"Many skills, one entry point","needs":["share-skill-pr"],"can":"I can organise a growing set of skills so the right one is found, and stop two skills overlapping.","proof":"Two overlapping skills merged or their descriptions separated."}];
const TIERS = [["0","Before"],["1","Chat to agent"],["2","Rules"],["3","Git"],["4","Skills"],["5","Connect"],["6","Share"],["B","Branches"]];
const GOAL = "share-skill-pr";
const byId = Object.fromEntries(NODES.map(n => [n.id, n]));

const state = { view: "me", mine: {}, room: [], selected: null, uid: null, db: null, canWrite: null, saving: false, mode: "connecting" };

function myStatus(id){ const r = state.mine[id]; return r ? r.s : null; }
function nodeState(n){
  const s = myStatus(n.id);
  if (s === "done") return "done";
  if (s === "partly") return "part";
  return n.needs.every(x => myStatus(x) === "done") ? "open" : "locked";
}
function roomCounts(id){
  let d = 0, p = 0;
  for (const r of state.room){ const s = r.nodes && r.nodes[id] && r.nodes[id].s; if (s === "done") d++; else if (s === "partly") p++; }
  return { d, p };
}
const LABEL = { done: "done", part: "partly", open: "unlocked", locked: "locked" };

function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function renderLegend(){
  const L = document.getElementById("legend"); L.replaceChildren();
  const items = state.view === "me"
    ? [["done","Done"],["part","Partly"],["open","Unlocked: start here"],["","Locked"]]
    : [["done","People done"],["part","People partly there"]];
  for (const [c, t] of items){ const s = el("span"); const d = el("i", "dot " + c); s.append(d, document.createTextNode(t)); L.append(s); }
}

function renderLanes(){
  const lanes = document.getElementById("lanes"); lanes.replaceChildren();
  lanes.classList.toggle("room", state.view === "room");
  const people = state.room.length;
  for (const [tier, name] of TIERS){
    const lane = el("section", "lane");
    const h = el("h2"); h.append(document.createTextNode(tier === "B" ? "Extra" : "Tier " + tier), el("strong", null, name)); lane.append(h);
    for (const n of NODES.filter(x => x.tier === tier)){
      const b = el("button", "node"); b.type = "button";
      if (n.id === GOAL) b.classList.add("goal");
      b.setAttribute("aria-current", state.selected === n.id ? "true" : "false");
      b.append(el("span", "t", n.title));
      const meta = el("span", "meta");
      if (state.view === "me"){
        const st = nodeState(n); b.classList.add(st);
        meta.append(el("span", "pill", LABEL[st]));
      } else {
        const { d, p } = roomCounts(n.id);
        meta.append(el("span", null, people ? `${d} done · ${p} partly` : "no one yet"));
        const bar = el("span", "bar");
        if (people){ const di = el("i", "d"); di.style.width = (100 * d / people) + "%"; const pi = el("i", "p"); pi.style.width = (100 * p / people) + "%"; bar.append(di, pi); }
        b.append(meta, bar); b.addEventListener("click", () => select(n.id)); lane.append(b); continue;
      }
      b.append(meta);
      b.addEventListener("click", () => select(n.id));
      lane.append(b);
    }
    lanes.append(lane);
  }
}

function renderDrawer(){
  const D = document.getElementById("drawer"); D.replaceChildren();
  const n = byId[state.selected];
  if (!n){
    const next = NODES.filter(x => nodeState(x) === "open");
    D.append(el("p", "k", "Next up"));
    if (state.view === "room"){ D.append(el("p", "empty", `${state.room.length} ${state.room.length === 1 ? "person has" : "people have"} saved progress. Pick a node to see how many are there.`)); return; }
    if (!next.length){ D.append(el("p", "empty", "Nothing unlocked. Start with the setup nodes.")); return; }
    const ul = el("div", "row");
    for (const x of next.slice(0, 3)){ const b = el("button", "btn", x.title); b.type = "button"; b.addEventListener("click", () => select(x.id)); ul.append(b); }
    D.append(el("p", "empty", "Pick one of these, or any unlocked node."), ul);
    return;
  }
  D.append(el("p", "k", n.tier === "B" ? "Extra" : "Tier " + n.tier), el("h3", null, n.title));
  const c = el("div"); c.append(el("p", "k", "You'll be able to say"), el("p", "can", n.can)); D.append(c);
  const pr = el("div"); pr.append(el("p", "k", "Proof"), el("p", null, n.proof)); D.append(pr);
  if (n.needs.length){
    const nd = el("div"); nd.append(el("p", "k", "Needs"), el("p", "note", n.needs.map(x => byId[x].title).join(" · "))); D.append(nd);
  }
  if (state.view === "room"){
    const { d, p } = roomCounts(n.id);
    D.append(el("p", "note", `${d} done, ${p} partly, out of ${state.room.length} with saved progress.`));
    return;
  }
  const st = nodeState(n), mine = state.mine[n.id];
  if (mine && mine.because){ const bc = el("div"); bc.append(el("p", "k", "How you showed it"), el("p", "because", mine.because)); D.append(bc); }
  if (st === "locked"){
    const missing = n.needs.filter(x => myStatus(x) !== "done").map(x => byId[x].title);
    D.append(el("p", "note", "Unlocks after: " + missing.join(", ") + "."));
    return;
  }
  if (state.mode !== "live"){ D.append(el("p", "note", "Saving isn't available in this view, so progress can't be recorded here.")); return; }
  if (state.canWrite === false){ D.append(el("p", "note", "You can view this board but not save to it. Ask the facilitator to invite you as an editor.")); return; }
  const lab = el("label", "k", "How did you show it?"); lab.htmlFor = "because";
  const ta = el("textarea"); ta.id = "because"; ta.placeholder = "One line: what you did, and where someone could see it."; ta.value = mine ? (mine.because || "") : "";
  const row = el("div", "row");
  const done = el("button", "btn primary", "Mark done"); done.type = "button";
  const part = el("button", "btn part", "Partly"); part.type = "button";
  row.append(done, part);
  if (mine){ const clr = el("button", "btn", "Clear"); clr.type = "button"; clr.addEventListener("click", () => save(n.id, null, "")); row.append(clr); }
  const hint = el("p", "note", "Done needs a line of evidence. Partly can say what's missing.");
  const sync = () => { done.disabled = state.saving || !ta.value.trim(); part.disabled = state.saving; };
  ta.addEventListener("input", sync); sync();
  done.addEventListener("click", () => save(n.id, "done", ta.value.trim()));
  part.addEventListener("click", () => save(n.id, "partly", ta.value.trim()));
  D.append(lab, ta, row, hint);
}

function render(){ renderLegend(); renderLanes(); renderDrawer(); renderStatus(); }
function renderStatus(){
  const s = document.getElementById("status");
  const doneCount = Object.values(state.mine).filter(r => r.s === "done").length;
  if (state.mode === "connecting") s.textContent = "Connecting…";
  else if (state.mode === "offline") s.textContent = "Not connected: you're seeing the tree without saved progress.";
  else { s.replaceChildren(document.createTextNode("Saved progress: "), el("b", null, `${doneCount} of ${NODES.length} done`), document.createTextNode(` · ${state.room.length} ${state.room.length === 1 ? "person" : "people"} on the board`)); }
}
function select(id){ state.selected = state.selected === id ? null : id; render(); }

async function save(id, s, because){
  if (!state.db || !state.uid || state.saving) return;
  state.saving = true; renderDrawer();
  const nodes = { ...state.mine };
  if (s) nodes[id] = { s, because, at: new Date().toISOString() }; else delete nodes[id];
  try { await state.db.doc("progress/" + state.uid).set({ nodes }); }
  catch (e) {
    if (e && e.code === "invalid_argument") state.canWrite = false;
    else alertNote("Couldn't save. Try again in a moment.");
  }
  state.saving = false; render();
}
function alertNote(t){ const s = document.getElementById("status"); s.textContent = t; }

document.getElementById("v-me").addEventListener("click", () => setView("me"));
document.getElementById("v-room").addEventListener("click", () => setView("room"));
function setView(v){ state.view = v; document.getElementById("v-me").setAttribute("aria-pressed", v === "me"); document.getElementById("v-room").setAttribute("aria-pressed", v === "room"); render(); }

render();
(async () => {
  const claude = window.claude;
  const [db, user] = claude && claude.use ? await Promise.all([claude.use("db"), claude.use("user")]) : [null, null];
  const uid = user ? await user.id() : null;
  if (!db || !uid){ state.mode = "offline"; render(); return; }
  state.db = db; state.uid = uid; state.mode = "live";
  state.canWrite = await user.can("data.write");
  db.doc("progress/" + uid).onSnapshot(snap => {
    const d = snap.exists ? snap.data() : null;
    state.mine = d && d.nodes ? d.nodes : {}; render();
  }, () => { state.mode = "offline"; render(); });
  db.collection("progress").onSnapshot(q => {
    state.room = q.docs.map(x => x.data() || {}); render();
  }, () => {});
})();
</script>
